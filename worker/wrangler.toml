name = "verdant-ledger-pipeline"
main = "dist/index.js"
compatibility_date = "2026-01-01"

# Plain (non-secret) variables. Replace with your own values.
[vars]
CLIENT_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/PASTE_YOUR_PUBLISHED_ID/pub?output=csv"
ALLOWED_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"

# GOOGLE_API_KEY is a SECRET — do not put it here.
# Get a free key (no credit card) at https://aistudio.google.com/apikey
# Set it once with:
#   wrangler secret put GOOGLE_API_KEY
